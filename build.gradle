import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins {
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'com.github.johnrengelman.shadow' version "${shadow_version}" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev' }
        maven { url = 'https://maven.latvian.dev/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
    }

    configurations {
        entityJsParchment
    }

    dependencies {
        entityJsParchment "org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip"
    }

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    def java17Launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = java17Launcher
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

ext.loadEntityJsParchmentParameters = { File archive ->
    def zipFile = new ZipFile(archive)
    try {
        def entry = zipFile.getEntry('parchment.json')
        if (entry == null) {
            throw new GradleException("Missing parchment.json in ${archive}")
        }
        def root = new JsonSlurper().parse(zipFile.getInputStream(entry), 'UTF-8')
        def parameters = [:]
        root.classes.each { mappedClass ->
            mappedClass.methods.each { mappedMethod ->
                if (mappedMethod.parameters) {
                    def slots = mappedMethod.parameters.collectEntries { parameter ->
                        [(parameter.index as Integer): parameter.name.toString()]
                    }
                    parameters["${mappedClass.name}\t${mappedMethod.name}\t${mappedMethod.descriptor}"] = slots
                }
            }
        }
        return parameters
    } finally {
        zipFile.close()
    }
}

ext.encodeEntityJsParameterSlots = { Map<Integer, String> slots ->
    if (slots == null || slots.isEmpty()) {
        return ''
    }
    return slots.entrySet().sort { left, right -> left.key <=> right.key }
            .collect { entry -> "${entry.key}:${entry.value}" }
            .join(';')
}
