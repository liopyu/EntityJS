import java.time.Instant

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.112'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup "software.bernie.geckolib" }
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
        content {
            includeGroup "org.parchmentmc.data"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content { includeGroup "com.github.rtyley" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version
    accessTransformers {
        publish(project.file("src/main/resources/META-INF/accesstransformer.cfg"))
    }

    mods {
        entityjs {
            sourceSet sourceSets.main
        }
    }

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            [
                    'entityjs.profileCallbacks',
                    'entityjs.profileCallbacks.focusMethod',
                    'entityjs.profileCallbacks.intervalSeconds',
                    'entityjs.profileCallbacks.minMillis',
                    'entityjs.profileCallbacks.minMicros',
                    'entityjs.profileCallbacks.slowStacks',
                    'entityjs.profileCallbacks.slowStackMillis',
                    'entityjs.profileCallbacks.slowStackLimit'
            ].each { key ->
                def value = System.getProperty(key)
                if (value != null) {
                    systemProperty key, value
                }
            }
        }
        client {
            client()
            gameDirectory = project.file("runs/client")
        }
        server {
            server()
            gameDirectory = project.file("runs/server")
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    parchmentData {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    api("curse.maven:probejs-585406:8304356")
    api("dev.latvian.mods:rhino:$rhino_version")
    api("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
    api("software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}")
    parchmentData("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neoforge_version,
            neo_version_range      : loader_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    from({ configurations.parchmentData.collect { zipTree(it) } }) {
        include 'parchment.json'
        into 'entityjs/parchment'
    }
}

def javaImportCleanupScript = layout.projectDirectory.file("utils/cleanup/cleanup_java_imports.py")
def javaImportCleanupRoots = [layout.projectDirectory.dir("src/main/java")]
def javaImportCleanupPython = providers.gradleProperty("pythonExecutable").orElse("python")

tasks.register("cleanupJavaImports") {
    group = "formatting"
    description = "Removes unused Java imports and shortens safe inline fully qualified type references."
    inputs.file(javaImportCleanupScript)
    inputs.dir(layout.projectDirectory.dir("src/main/java"))
    outputs.upToDateWhen { false }

    doLast {
        exec {
            commandLine(
                    javaImportCleanupPython.get(),
                    javaImportCleanupScript.asFile.absolutePath,
                    *javaImportCleanupRoots.collect { it.asFile.absolutePath }
            )
        }
    }
}

tasks.register("checkJavaImportCleanup") {
    group = "verification"
    description = "Checks whether cleanupJavaImports would change Java sources."
    inputs.file(javaImportCleanupScript)
    inputs.dir(layout.projectDirectory.dir("src/main/java"))
    outputs.upToDateWhen { false }

    doLast {
        exec {
            commandLine(
                    javaImportCleanupPython.get(),
                    javaImportCleanupScript.asFile.absolutePath,
                    "--check",
                    *javaImportCleanupRoots.collect { it.asFile.absolutePath }
            )
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
