import org.gradle.internal.os.OperatingSystem

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'


}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def findAvailableRunDir(base = "run") {
    def i = 0
    while (true) {
        def dir = file(i == 0 ? base : "${base}${i}")
        if (!dir.exists() || !file("${dir}/session.lock").exists()) {
            return dir
        }
        i++
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            def instanceId = project.hasProperty("instance") ? project.property("instance") : "0"
            def runDir = "run${instanceId == '0' ? '' : instanceId}"
            def username = "Dev${instanceId == '0' ? '' : instanceId}"

            workingDirectory = project.file(runDir)
            args '--mixin.config=entityjs.mixins.json', '--debug', '--username', username
            property 'forge.client.window.title', username
            property 'geckolib.disable_examples', 'true'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'entityjs'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "entityjs" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}


// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }

    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
    //maven { url 'https://dl.cloudsmith.io/public/lio/liolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("curse.maven:framework-549225:5180972")
    compileOnly fg.deobf("curse.maven:mrcrayfishs-gun-mod-unofficial-945471:5212457")

    /*runtimeOnly fg.deobf("curse.maven:additional-attributes-986624:6013214")
    runtimeOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6054196")
    runtimeOnly fg.deobf("curse.maven:curios-309927:6058834")
    runtimeOnly fg.deobf("curse.maven:playeranimator-658587:4587214")
    runtimeOnly fg.deobf("curse.maven:caelus-308989:5281700")*/
    /*implementation fg.deobf("curse.maven:framework-549225:5180972")
    implementation fg.deobf("curse.maven:mrcrayfishs-gun-mod-unofficial-945471:5212457")*/
    //implementation fg.deobf("curse.maven:corail-tombstone-243707:5395076")
    //ProbeJS 6.1
    implementation fg.deobf("curse.maven:probejs-$probejs_snippet")
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:$kubejs_version")
    implementation fg.deobf("dev.latvian.mods:rhino-forge:$rhino_version")
    implementation fg.deobf("dev.architectury:architectury-forge:$architectury_version")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-$geckolib_version")
    // Use kube's jij'd version
    implementation fg.deobf("io.github.llamalad7:mixinextras-common:0.2.1")
    //implementation fg.deobf('net.liopyu.liolib:liolib-forge-1.19.2:0.0.2')
    if (System.getProperty("idea.sync.active") != "true") {
        annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
    }
}

tasks.register('runClient1') {
    group = 'forgegradle runs'
    description = 'Launch a second client instance in a new terminal window'

    doLast {
        def command
        if (OperatingSystem.current().isWindows()) {
            command = ["cmd", "/c", "start", "cmd", "/k", "gradlew runClient -Pinstance=1"]
        } else if (OperatingSystem.current().isMacOsX()) {
            command = ["osascript", "-e", 'tell application "Terminal" to do script "cd ' + projectDir + ' && ./gradlew runClient -Pinstance=1"']
        } else if (OperatingSystem.current().isLinux()) {
            command = ["gnome-terminal", "--", "bash", "-c", "cd ${projectDir} && ./gradlew runClient -Pinstance=1; exec bash"]
        } else {
            throw new GradleException("Unsupported OS")
        }
        exec {
            commandLine command
        }
    }
}
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "entityjs.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            // Shedaniel's maven (Architectury API)
            url = "https://maven.architectury.dev"
            content {
                includeGroup "dev.architectury"
            }
        }

        maven {
            // saps.dev Maven (KubeJS and Rhino)
            url = "https://maven.saps.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

mixin {
    add sourceSets.main, "entityjs.refmap.json"
}
